name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ipa.yml'
      - 'ios/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build unsigned IPA (scrcpy-ios)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      # 1) 先取本仓库，拿到 ios/overlay 下的定制文件
      - name: Checkout this repo (for overlay)
        uses: actions/checkout@v4
        with:
          path: here

      # 2) 再取上游客户端源码
      - name: Checkout iOS client (upstream)
        uses: actions/checkout@v4
        with:
          repository: TheCodeboy12/scrcpy-ios-client
          ref: main
          path: src

      # 3) 用定制 UI 覆盖上游文件
      - name: Apply overlay (recursive merge)
        run: |
          set -euo pipefail
          OVL="$GITHUB_WORKSPACE/here/ios/overlay"
          DST="$GITHUB_WORKSPACE/src"
          echo "=== overlay 文件 ==="
          (cd "$OVL" && find . -type f | sort)
          echo "=== 覆盖到 src ==="
          cd "$OVL"
          find . -type f | while read -r f; do
            target="$DST/${f#./}"
            mkdir -p "$(dirname "$target")"
            cp -f "$f" "$target"
            echo "  -> ${f#./}"
          done
          echo "=== 硬校验（缺失即失败）==="
          grep -q "TouchMeta" "$DST/Sources/ScrcpyKit/Session/GestureController.swift" \
            || { echo "FAIL: 触摸补丁未落盘"; exit 1; }
          grep -q "eye.slash.fill" "$DST/Sources/ScrcpyApp/Views/MirrorSessionView.swift" \
            || { echo "FAIL: HUD 按钮未落盘"; exit 1; }
          if grep -q "\.onTapGesture {" "$DST/Sources/ScrcpyApp/Views/MirrorSessionView.swift"; then
            echo "FAIL: 整屏 onTapGesture 仍存在，会吞掉点击"
            exit 1
          fi
          grep -q "ScrcpyConnectView" "$DST/Sources/ScrcpyApp/ScrcpyApp.swift" \
            || { echo "FAIL: 根视图未切换"; exit 1; }
          grep -q "ControlQueue" "$DST/Sources/ScrcpyKit/Session/ScrcpyClient.swift" \
            || { echo "FAIL: 控制队列补丁未落盘"; exit 1; }
          echo "  全部补丁已确认落盘"

      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: src
        run: xcodegen generate

      - name: Run ScrcpyKit tests
        working-directory: src
        run: |
          set -o pipefail
          mkdir -p build
          swift run ScrcpyTests 2>&1 | tee build/test.log

      - name: Build (unsigned)
        working-directory: src
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build
          xcodebuild -project ScrcpyiOS.xcodeproj \
            -scheme ScrcpyApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Scrcpy.xcarchive \
            -derivedDataPath build/dd \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO 2>&1 | tee build/xcodebuild.log

      - name: Verify built binary carries the fix
        working-directory: src
        run: |
          APP_DIR="build/Scrcpy.xcarchive/Products/Applications/ScrcpyApp.app"
          KIT="$APP_DIR/Frameworks/ScrcpyKit.framework/ScrcpyKit"
          APP="$APP_DIR/ScrcpyApp"
          REPORT="build/verify.txt"
          {
            echo "=== paths ==="
            ls -l "$KIT" "$APP" 2>&1 || true
            echo "=== markers in ScrcpyKit ==="
            for m in TouchMeta onSingleTap CancelsTouchesInView didMoveToWindow; do
              if grep -aq "$m" "$KIT" 2>/dev/null; then echo "  $m = yes"; else echo "  $m = no"; fi
            done
            echo "=== markers in ScrcpyApp ==="
            for m in eye.slash.fill eye.fill film.stack xmark.circle.fill MirrorSessionView showControls; do
              if grep -aq "$m" "$APP" 2>/dev/null; then echo "  $m = yes"; else echo "  $m = no"; fi
            done
            echo "=== verdict ==="
            ok=1
            for m in TouchMeta onSingleTap CancelsTouchesInView; do
              if ! grep -aq "$m" "$KIT" 2>/dev/null; then ok=0; echo "  MISSING in kit: $m"; fi
            done
            if [ "$ok" = "1" ]; then echo "  PASS"; else echo "  FAIL"; fi
          } > "$REPORT" 2>&1
          cat "$REPORT"

      - name: Package IPA
        working-directory: src
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -r build/Scrcpy.xcarchive/Products/Applications/ScrcpyApp.app build/Payload/
          APP="build/Payload/ScrcpyApp.app"
          {
            echo "commit=${{ github.sha }}"
            echo "run=#${{ github.run_number }}"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "--- source sha256 ---"
            shasum -a 256 Sources/ScrcpyApp/Views/ScrcpyConnectView.swift \
                          Sources/ScrcpyApp/Views/MirrorSessionView.swift \
                          Sources/ScrcpyApp/ScrcpyApp.swift \
                          Sources/ScrcpyKit/Session/GestureController.swift \
                          Sources/ScrcpyKit/Session/ScrcpyClient.swift
            echo "--- markers ---"
            grep -c "TouchMeta" Sources/ScrcpyKit/Session/GestureController.swift || true
            grep -c "eye.slash.fill" Sources/ScrcpyApp/Views/MirrorSessionView.swift || true
          } > "$APP/BUILDINFO.txt"
          cp -f build/verify.txt "$APP/VERIFY.txt" 2>/dev/null || echo "no verify report" > "$APP/VERIFY.txt"
          cat "$APP/BUILDINFO.txt"
          echo "-----"
          cat "$APP/VERIFY.txt"
          cd build && zip -qry Scrcpy-ios.ipa Payload
          ls -lh Scrcpy-ios.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scrcpy-ios-ipa
          path: src/build/Scrcpy-ios.ipa
          retention-days: 30

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p src/build
          exec > >(tee -a src/build/publish.log) 2>&1
          TAG="scrcpy-ios"
          SHA="${GITHUB_SHA:0:7}"
          NOTES=$(printf '%s\n' \
            "scrcpy-ios 定制 UI 版（未签名） · build #${{ github.run_number }} · commit $SHA" \
            "" \
            "修复：投屏画面单击失效（整屏 onTapGesture 会吞掉触摸，已改为补发 up + 独立显隐按钮）。" \
            "" \
            "安装：Sideloadly / AltStore 配自己的 Apple ID 自签，免费证书 7 天到期。" \
            "连接：Host 填设备 Tailscale IP，Port 填 5555，平板侧先开无线调试并 adb tcpip 5555。")
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, uploading with clobber"
            gh release upload "$TAG" src/build/Scrcpy-ios.ipa --clobber
          else
            echo "Creating release $TAG"
            gh release create "$TAG" src/build/Scrcpy-ios.ipa \
              --title "scrcpy-ios · 定制 UI" \
              --notes "$NOTES" \
              --prerelease
          fi
          echo "=== diagnostic verdict ==="
          cat src/build/verify.txt
          grep -q "PASS" src/build/verify.txt || { echo "VERDICT: fix not compiled in"; exit 1; }

      - name: Publish failure logs
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p src/build
          [ -s src/build/test.log ] || echo "(no test output)" > src/build/test.log
          [ -s src/build/xcodebuild.log ] || echo "(no xcodebuild output)" > src/build/xcodebuild.log
          echo "=== test.log tail ==="
          tail -c 3000 src/build/test.log || true
          echo "=== xcodebuild.log tail ==="
          tail -c 3000 src/build/xcodebuild.log || true
          TESTTAIL=$(tail -c 38000 src/build/test.log 2>/dev/null || echo none)
          BUILTTAIL=$(tail -c 38000 src/build/xcodebuild.log 2>/dev/null || echo none)
          BODY=$(printf "CI failed on %s (run %s)\n\n[test.log]\n%s\n\n[xcodebuild.log]\n%s" \
            "${{ github.sha }}" "#${{ github.run_number }}" "$TESTTAIL" "$BUILTTAIL")
          gh release edit scrcpy-ios --notes "$BODY" 2>&1 || echo "release edit failed"
          gh release upload ci-logs src/build/test.log src/build/xcodebuild.log --clobber 2>&1 || gh release create ci-logs src/build/test.log src/build/xcodebuild.log --title "CI failure logs" --prerelease 2>&1 || echo "log publish failed"

      - name: Commit failure log (for offline inspection)
        if: failure()
        run: |
          set +e
          HERE="$GITHUB_WORKSPACE/here"
          cd "$HERE"
          {
            echo "run #${{ github.run_number }} / ${{ github.sha }}"
            echo "===== test.log (tail) ====="
            tail -c 8000 "$GITHUB_WORKSPACE/src/build/test.log" 2>/dev/null
            echo
            echo "===== xcodebuild errors ====="
            grep -a -n "error:" "$GITHUB_WORKSPACE/src/build/xcodebuild.log" 2>/dev/null | tail -30
            echo
            echo "===== xcodebuild.log (tail) ====="
            tail -c 1500 "$GITHUB_WORKSPACE/src/build/xcodebuild.log" 2>/dev/null
            echo
            echo "===== publish.log ====="
            tail -c 4000 "$GITHUB_WORKSPACE/src/build/publish.log" 2>/dev/null
          } > ci-error.txt
          git config user.email "ci@example.com"
          git config user.name "ci-bot"
          git add ci-error.txt
          git commit -m "ci: failure log for run ${{ github.run_number }}" -q
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git pull --rebase "$REMOTE" main || true
          git push "$REMOTE" HEAD:main || echo "log push failed"
          echo "done
